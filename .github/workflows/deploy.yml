name: Deploy bridge

'on':
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Every branch targets the same service. Never interrupt a deployment in progress.
concurrency:
  group: deploy-mqtt-kafka-bridge
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deployment
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml
  deploy:
    name: Deploy verified bridge
    needs: verify
    runs-on: self-hosted
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.0
      - name: Verify Docker Compose availability
        run: docker compose version
      - name: Download the verified application JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gladys-bridge-${{ github.sha }}
          path: target
      - name: Update the bridge service
        env:
          GLADYS_ENV_FILE: ${{ vars.GLADYS_ENV_FILE || '/etc/gladys/gladys.env' }}
        run: bash .github/scripts/deploy.sh
