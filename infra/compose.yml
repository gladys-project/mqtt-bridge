name: gladys-infrastructure

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks: [gladys]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [gladys]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 5 > /dev/null"]
      interval: 5s
      timeout: 6s
      retries: 10
  mongo:
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    profiles: [mongo]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: gladys_admin
      MONGO_INITDB_ROOT_PASSWORD: ${GLADYS_MONGO_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: plant_device_data
      GLADYS_MONGO_PLANT_DEVICE_PASSWORD: ${GLADYS_MONGO_PLANT_DEVICE_PASSWORD:-}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        : "$${MONGO_INITDB_ROOT_PASSWORD:?Set GLADYS_MONGO_ROOT_PASSWORD in the shared env file}"
        : "$${GLADYS_MONGO_PLANT_DEVICE_PASSWORD:?Set GLADYS_MONGO_PLANT_DEVICE_PASSWORD in the shared env file}"
        exec docker-entrypoint.sh mongod
    configs:
      - source: plant-device-data-mongo-init
        target: /docker-entrypoint-initdb.d/01-plant-device-data.js
    volumes:
      - mongo-data:/data/db
    networks: [gladys]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --norc
        - --host
        - mongo
        - plant_device_data
        - --eval
        - 'if (!db.auth("plant_device_data", process.env.GLADYS_MONGO_PLANT_DEVICE_PASSWORD)) quit(1); quit(db.runCommand({ping: 1}).ok ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  apisix:
    image: apache/apisix:3.21.0-debian@sha256:1741a8e1186e5c39ea10e6b4fb3e682534d1705efb8328195de5b41ad0657380
    profiles: [apisix]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APISIX_HTTP_PORT:-9080}:9080"
    environment:
      APISIX_STAND_ALONE: "true"
    configs:
      - source: apisix-config
        target: /usr/local/apisix/conf/config.yaml
      - source: apisix-routes
        target: /usr/local/apisix/conf/apisix.yaml
    networks: [gladys]
    healthcheck:
      # The Debian image does not include curl.
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/7085
          printf 'GET /status/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r protocol status reason <&3
          test "$$status" = 200
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

configs:
  apisix-config:
    content: |
      apisix:
        node_listen: 9080
        enable_ipv6: false
        enable_control: false
        ssl:
          enable: false
        status:
          ip: 127.0.0.1
          port: 7085
      deployment:
        role: data_plane
        role_data_plane:
          config_provider: yaml
  apisix-routes:
    content: |
      routes:
        - id: plant-device-list
          uri: /devices
          methods: [GET]
          upstream:
            type: roundrobin
            nodes:
              "plant-device-data-service:8080": 1
      #END
  plant-device-data-mongo-init:
    content: |
      db.createUser({
        user: "plant_device_data",
        pwd: process.env.GLADYS_MONGO_PLANT_DEVICE_PASSWORD,
        roles: [{role: "readWrite", db: "plant_device_data"}]
      });

volumes:
  mongo-data:

networks:
  gladys:
    external: true
    name: ${GLADYS_NETWORK:-gladys}
