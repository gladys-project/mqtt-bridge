name: mqtt-kafka-bridge

services:
  mqtt-kafka-bridge:
    image: ${BRIDGE_IMAGE:-mqtt-kafka-bridge:local}
    build:
      context: .
    env_file:
      - ${BRIDGE_ENV_FILE:-.env}
    environment:
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${BRIDGE_HTTP_PORT:-8080}:8080"
    networks: [gladys]
    restart: unless-stopped

networks:
  gladys:
    external: true
    name: ${GLADYS_NETWORK:-gladys}
