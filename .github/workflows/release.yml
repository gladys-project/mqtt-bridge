name: Release

'on':
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish verified JAR
    needs: verify
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gladys-bridge-${{ github.sha }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.jar
          --verify-tag --generate-notes --title "$RELEASE_TAG"
