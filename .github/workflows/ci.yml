name: Gladys CI

'on':
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25 / Maven verify
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Require Docker for broker integration tests
        run: docker info
      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Validate separate Compose stacks
        env:
          BRIDGE_ENV_FILE: .env.example
        run: |
          docker compose config --quiet
          docker compose -f infra/compose.yml config --quiet
      - name: Build service image
        run: docker build --tag mqtt-kafka-bridge:ci .
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified application JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gladys-bridge-${{ github.sha }}
          path: target/mqtt-kafka-bridge-*.jar
          if-no-files-found: error
          retention-days: 14
