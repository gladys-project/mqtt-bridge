openapi: 3.1.2
info:
  title: Gladys MQTT inbound messages
  version: 1.0.0
  description: Device observation received over MQTT, containing device data and raw telemetry.
paths: {}
components:
  schemas:
    MqttTelemetryMessage:
      type: object
      additionalProperties: false
      description: |
        Complete device observation received on the MQTT telemetry topic. The bridge
        preserves the envelope, device diagnostics and sensor payload in one Kafka
        record keyed by deviceId. Downstream services resolve soil from sensorId;
        a device may report readings from different sensors in different soils.
      required:
        - schemaVersion
        - eventId
        - eventType
        - deviceId
        - bootId
        - sequence
        - uptimeMs
        - observedAt
        - clockSource
        - errors
        - payload
      properties:
        schemaVersion:
          type: integer
          const: 1
        eventId:
          type: string
          format: uuid
          description: Identity of this observation; preserved across transport retries.
        eventType:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Sensor observation type, for example SOIL_MOISTURE_READING.
        deviceId:
          type: string
          format: uuid
          description: Device identity and intended Kafka key.
        bootId:
          type: string
          format: uuid
          description: Identity of the device boot session.
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Nonnegative sequence within a boot session.
        uptimeMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Device uptime in milliseconds at observation.
        observedAt:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Observation time as Unix epoch milliseconds, not an RFC 3339 string.
        clockSource:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Clock provenance, for example MANUAL_TEST. No closed vocabulary is established yet.
        batteryLevelPct:
          type: integer
          minimum: 0
          maximum: 100
          description: Battery charge percentage when available. Omit for a device without a battery charge reading.
          x-jackson-json-include-policy: NON_NULL
        supplyVoltageMv:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Estimated device-board supply rail voltage in millivolts when measured.
          x-jackson-json-include-policy: NON_NULL
        errors:
          type: array
          description: Complete active diagnostic snapshot for this device. An empty array reports no active conditions. Identify conditions by component and code.
          items:
            $ref: '#/components/schemas/DeviceError'
        payload:
          $ref: '#/components/schemas/TelemetryPayload'
    TelemetryPayload:
      type: object
      additionalProperties: true
      description: |
        Sensor-specific reading. sensorId identifies the sensor; downstream services
        resolve its soil and calibration context. Measurement fields are preserved
        without interpretation, supporting different sensor types and soils.
        For moisture, rawMoisture is an ADC count, not a percentage.
      required: [sensorId]
      properties:
        sensorId:
          type: string
          format: uuid
          description: Stable UUID assigned to this physical sensor, retained across readings and device boots.
        plantId:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
        calibrationId:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
        rawMoisture:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Rounded mean of the soil sensor ADC samples; not a moisture percentage.
        rawMoistureMin:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Smallest ADC value in the same sample batch.
        rawMoistureMax:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Largest ADC value in the same sample batch.
        sampleCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Number of samples used in the mean and range, excluding discarded conversions.
    DeviceError:
      type: object
      additionalProperties: false
      required: [code, component, severity, message]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[A-Z0-9]{3}_[A-Z0-9]{2}$'
          description: Stable condition identifier with five uppercase alphanumeric characters and one underscore, such as BAT_01. Keep the code unchanged when severity changes.
          example: BAT_01
          x-diagnostic-codes:
            BAT_01: Low battery charge
            BAT_02: Battery measurement unavailable
            SEN_01: Sensor read failed
            SEN_02: Sensor reading outside its supported range
            PMP_01: Pump activation failed
            PMP_02: Pump failed to stop
        component:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Stable identifier of the reporting component instance, such as SOIL_SENSOR_A or SOIL_SENSOR_B.
        severity:
          type: string
          enum: [INFO, WARNING, ERROR, CRITICAL]
          description: Current severity of this condition. Condition identity uses component and code.
        message:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
