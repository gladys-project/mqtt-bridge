# Isolated test settings; no local profile, environment credential placeholders or developer config.
spring:
  application:
    name: mqtt-kafka-bridge
  main:
    web-application-type: reactive
  cloud:
    stream:
      function:
        autodetect: false
  kafka:
    bootstrap-servers: 127.0.0.1:1
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    consumer:
      group-id: mqtt-kafka-bridge-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        allow.auto.create.topics: false
    listener:
      auto-startup: false
bridge:
  mqtt:
    host: 127.0.0.1
    port: 1
    identifier: mqtt-kafka-bridge
    qos: 1
    telemetry-topic: gladys/devices/+/telemetry
  topics:
    telemetry: gladys.telemetry.raw.v1
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
